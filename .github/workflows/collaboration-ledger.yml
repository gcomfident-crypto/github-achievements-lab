name: Generate collaboration ledger

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-ledger-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate a traceable collaboration entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/collaboration-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          mkdir -p reports
          {
            echo "# Collaboration run ${GITHUB_RUN_ID}"
            echo
            echo "Generated by GitHub Actions from a workflow authored and dispatched by gcomfident-crypto."
            echo
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Workflow: ${GITHUB_WORKFLOW}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "reports/run-${GITHUB_RUN_ID}.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "reports/run-${GITHUB_RUN_ID}.md"
          git commit -m "Add automated collaboration ledger entry" -m "Co-authored-by: Comfident <233575786+gcomfident-crypto@users.noreply.github.com>"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Add automated collaboration ledger entry" --body "Generated by the collaboration-ledger workflow. The commit credits both the workflow bot and its human author."
